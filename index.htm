<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="site-title">StreamX - Pro Video Engine</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           PREMIUM MODERN CSS OVERHAUL
        ========================================= */
        :root { 
            --primary: #ff2a5f; 
            --primary-glow: rgba(255, 42, 95, 0.4);
            --bg: #09090c; 
            --card-bg: #15151a; 
            --card-border: #23232c;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --success: #10b981;
            --warning: #f59e0b;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { 
            background: var(--bg); 
            color: var(--text-main); 
            font-family: 'Inter', 'Hind Siliguri', sans-serif; 
            padding-bottom: 60px; 
            min-height: 100vh; 
            -webkit-user-select: none; 
            user-select: none; 
        }

        /* --- Header & Navigation --- */
        header { 
            background: rgba(9, 9, 12, 0.85); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 15px 20px; 
            position: sticky; 
            top: 0; 
            border-bottom: 1px solid var(--card-border); 
            z-index: 1000; 
            text-align: center; 
        }
        
        header h2 { 
            font-size: 26px; 
            font-weight: 800;
            color: var(--primary); 
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .live-status { 
            font-size: 13px; 
            color: #ef4444; 
            margin-top: 6px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 6px; 
            font-weight: 600;
        }
        
        .dot { 
            height: 10px; width: 10px; 
            background-color: #ef4444; 
            border-radius: 50%; 
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
            animation: blink 1.5s infinite; 
        }
        @keyframes blink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }

        /* --- Search Box --- */
        .search-box { width: 100%; max-width: 500px; margin: 15px auto 10px; position: relative; }
        .search-box input { 
            width: 100%; 
            padding: 12px 20px 12px 45px; 
            border-radius: 30px; 
            border: 1px solid var(--card-border); 
            background: #1a1a21; 
            color: white; 
            font-size: 15px;
            outline: none; 
            transition: 0.3s; 
        }
        .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
        .search-box::before {
            content: "\f002"; font-family: "Font Awesome 6 Free"; font-weight: 900;
            position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); font-size: 15px;
        }

        /* --- Category Bar --- */
        .category-bar { 
            display: flex; gap: 12px; overflow-x: auto; padding: 10px 5px; 
            width: 100%; max-width: 800px; margin: 0 auto; scrollbar-width: none; 
        }
        .category-bar::-webkit-scrollbar { display: none; }
        
        .cat-btn { 
            background: #1a1a21; color: var(--text-muted); 
            border: 1px solid var(--card-border); 
            padding: 8px 22px; border-radius: 25px; 
            cursor: pointer; white-space: nowrap; font-size: 14px; font-weight: 600; 
            transition: all 0.3s ease; flex-shrink: 0; 
        }
        .cat-btn:hover { background: #23232c; color: white; }
        .cat-btn.active { 
            background: var(--primary); color: white; 
            border-color: var(--primary); box-shadow: 0 4px 10px var(--primary-glow); 
        }

        /* --- Video Grid Container --- */
        .container { 
            max-width: 1200px; margin: 0 auto; padding: 25px 20px; 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; 
        }

        /* --- Video Card Design --- */
        .card { 
            background: var(--card-bg); 
            border-radius: 16px; overflow: hidden; 
            border: 1px solid var(--card-border); 
            display: flex; flex-direction: column; 
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); 
            border-color: #333340;
        }
        
        .video-wrapper { width: 100%; aspect-ratio: 16/9; position: relative; background: #000; overflow: hidden; }
        .video-wrapper img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .card:hover .video-wrapper img { transform: scale(1.05); }
        
        .lock-screen { 
            position: absolute; inset: 0; background: rgba(0,0,0,0.4); 
            display: flex; justify-content: center; align-items: center; 
            cursor: pointer; z-index: 30; transition: background 0.3s;
        }
        .lock-screen:hover { background: rgba(0,0,0,0.2); }
        
        .lock-icon { 
            font-size: 30px; background: rgba(255, 42, 95, 0.9); 
            color: white; border-radius: 50%; width: 65px; height: 65px; 
            display: flex; justify-content: center; align-items: center; 
            box-shadow: 0 0 20px var(--primary-glow); 
            backdrop-filter: blur(5px); padding-left: 5px; /* adjust play icon center */
            transition: transform 0.3s;
        }
        .lock-screen:hover .lock-icon { transform: scale(1.1); }

        .video-container { width: 100%; height: 100%; display: none; position: absolute; top: 0; left: 0; z-index: 20; background: #000; }
        iframe, video { width: 100%; height: 100%; border: none; outline: none; }

        /* --- Info Section inside Card --- */
        .info { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .info h3 { font-size: 18px; line-height: 1.4; margin-bottom: 8px; color: white; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .v-time { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; margin-bottom: 15px; }
        
        .stats-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 13px; color: var(--text-muted); }
        .stats-row .views { display: flex; align-items: center; gap: 5px; font-weight: 600; color: #e4e4e7; }
        .stats-row .badge { background: #272732; padding: 4px 10px; border-radius: 8px; border: 1px solid #333340; font-size: 12px; }

        /* --- Action Buttons --- */
        .react-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .react-btn { 
            flex: 1; background: #1e1e26; border: 1px solid var(--card-border); 
            color: var(--text-main); padding: 10px 0; border-radius: 10px; 
            cursor: pointer; font-size: 14px; font-weight: 600; 
            display: flex; justify-content: center; align-items: center; gap: 6px; 
            transition: 0.3s; 
        }
        .react-btn:hover:not(:disabled) { background: #272732; border-color: #3f3f4e; }
        .react-btn:disabled { cursor: not-allowed; opacity: 0.5; }
        
        .btn-unlock { 
            background: linear-gradient(135deg, var(--primary), #ff4b72); 
            color: #fff; border: none; padding: 14px; width: 100%; 
            border-radius: 12px; cursor: pointer; font-weight: 700; 
            font-size: 15px; box-shadow: 0 4px 15px var(--primary-glow);
            transition: transform 0.2s, box-shadow 0.2s; 
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-unlock:active { transform: scale(0.97); }
        
        .action-row { display: flex; gap: 10px; margin-top: 15px; }
        .btn-full-collection { 
            background: rgba(245, 158, 11, 0.1); color: var(--warning); 
            border: 1px solid var(--warning); padding: 12px; flex: 1; 
            border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 700; 
            display: flex; align-items: center; justify-content: center; gap: 8px; 
            transition: 0.3s; 
        }
        .btn-full-collection:hover { background: var(--warning); color: #000; }
        
        .copy-btn-small { 
            background: #1e1e26; color: #fff; border: 1px solid var(--card-border); 
            padding: 12px; border-radius: 10px; cursor: pointer; font-size: 16px; 
            display: flex; align-items: center; justify-content: center; 
            transition: 0.3s; flex-shrink: 0; width: 48px;
        }
        .copy-btn-small:hover { background: #272732; color: var(--primary); border-color: var(--primary); }

        /* --- Modals & Overlays --- */
        .ad-overlay { 
            position: absolute; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px);
            z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; 
        }
        .ad-content { 
            background: var(--primary); color: white; padding: 12px 25px; 
            border-radius: 30px; font-weight: bold; font-size: 15px; 
            box-shadow: 0 0 20px var(--primary-glow); animation: pulse 1.5s infinite; text-align: center; 
        }
        .ad-text-small { font-size: 13px; color: #d4d4d8; margin-top: 12px; text-align: center; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* Comments Modal */
        .comment-modal { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
            z-index: 2000; display: none; align-items: flex-end; justify-content: center; 
        }
        .comment-content { 
            background: var(--card-bg); width: 100%; max-width: 700px; height: 80vh; 
            border-radius: 24px 24px 0 0; display: flex; flex-direction: column; 
            border-top: 1px solid #333340; box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .comment-header { 
            padding: 20px; border-bottom: 1px solid var(--card-border); 
            display: flex; justify-content: space-between; align-items: center; 
            font-weight: 700; font-size: 18px; 
        }
        .close-comment { 
            background: #272732; border-radius: 50%; width: 32px; height: 32px; 
            display: flex; justify-content: center; align-items: center; 
            cursor: pointer; font-size: 18px; transition: 0.3s;
        }
        .close-comment:hover { background: var(--primary); color: white; transform: rotate(90deg); }
        
        .comment-list { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .comment-item { background: #1a1a21; padding: 15px 20px; border-radius: 16px; border-left: 4px solid var(--primary); }
        .comment-item strong { color: #fff; font-size: 15px; display: flex; align-items: center; gap: 8px; }
        .comment-item p { font-size: 15px; margin-top: 8px; color: #d4d4d8; line-height: 1.5; }
        
        .admin-reply { margin-top: 12px; background: rgba(16, 185, 129, 0.1); padding: 12px; border-radius: 10px; border-left: 3px solid var(--success); font-size: 14px; color: #e4e4e7; }
        .admin-reply strong { color: var(--success); }
        
        .comment-input-area { padding: 15px 20px; background: #0f0f13; display: flex; gap: 12px; border-top: 1px solid var(--card-border); }
        .comment-input-area input { 
            flex: 1; padding: 14px 20px; border-radius: 25px; 
            border: 1px solid #333340; background: #1a1a21; color: white; 
            outline: none; font-size: 15px; transition: 0.3s;
        }
        .comment-input-area input:focus { border-color: var(--primary); }
        .comment-input-area button { 
            background: var(--primary); color: white; border: none; padding: 0 25px; 
            border-radius: 25px; font-weight: 700; cursor: pointer; font-size: 15px; 
            transition: 0.3s; box-shadow: 0 4px 10px var(--primary-glow);
        }
        .comment-input-area button:hover { background: #e50914; transform: translateY(-2px); }

        /* Idle Popup */
        .idle-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 3000; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px); }
        .idle-box { background: var(--card-bg); border: 1px solid var(--card-border); padding: 35px 25px; border-radius: 20px; text-align: center; max-width: 400px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .idle-box p { font-size: 18px; margin-bottom: 25px; color: #fff; line-height: 1.5; font-weight: 600; }
        .idle-btn { background: var(--primary); color: #fff; border: none; padding: 14px 35px; border-radius: 25px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; box-shadow: 0 4px 15px var(--primary-glow); }
        .idle-btn:hover { background: #e50914; transform: scale(1.05); }

    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;" ondrop="return false;">

<header>
    <h2 id="site-name"><i class="fa-solid fa-play"></i> STREAMX</h2>
    <div class="live-status"><span class="dot"></span> <span id="user-count">...</span> জন অনলাইনে আছেন</div>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="ভিডিও খুঁজুন..." onkeyup="searchVideo()">
    </div>
    <div class="category-bar" id="category-container">
        <button class="cat-btn active" id="cat-btn-All" onclick="filterCategory('All', this)">All</button>
    </div>
</header>

<div class="container" id="video-list">
    <!-- Videos will be injected here -->
</div>

<!-- Comment Modal -->
<div id="commentModal" class="comment-modal">
    <div class="comment-content">
        <div class="comment-header">
            <span><i class="fa-regular fa-comments"></i> কমেন্টস (<span id="modal-comment-count">0</span>)</span>
            <div class="close-comment" onclick="closeComments()"><i class="fa-solid fa-xmark"></i></div>
        </div>
        <div class="comment-list" id="comment-list-container"></div>
        <div class="comment-input-area">
            <input type="text" id="new-comment-text" placeholder="আপনার মতামত লিখুন...">
            <button onclick="postComment()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<!-- Idle Ad Modal -->
<div id="idle-popup" class="idle-modal">
    <div class="idle-box">
        <p>আপনি কি ভিডিও দেখতে চান বা ওয়েবসাইটে থাকতে চান?</p>
        <button class="idle-btn" onclick="handleIdlePopupContinue()">কন্টিনিউ করুন</button>
    </div>
</div>

<script>
    // Security & UI tweaks
    document.addEventListener('keydown', e => { if (e.ctrlKey &&['c','s','u','p'].includes(e.key)) e.preventDefault(); });
    if (window.Telegram && window.Telegram.WebApp) { window.Telegram.WebApp.expand(); }

    // Global Variables
    let monetagZone = ""; let adsgramId = ""; let adTimesArray =[]; let tgAppUrl = ""; 
    let adsgramController = null;
    let currentVideoForComment = null; 
    let tgUserName = "Unknown User";
    let isAnyVideoPlaying = false;
    let idleTimeout = null; let idleAdInterval = 0; let idleAdsgramId = ""; let idleAdsgramController = null;

    if (window.Telegram?.WebApp?.initDataUnsafe?.user) {
        let u = window.Telegram.WebApp.initDataUnsafe.user;
        tgUserName = (u.first_name + " " + (u.last_name || "")).trim();
    }
    
    // API Endpoints
    const API_DATA_URL = 'api/data.php';
    const API_ACTION_URL = 'api/action.php';

    // Fetch Data on Load
    document.addEventListener('DOMContentLoaded', loadInitialData);

    function loadInitialData() {
        fetch(API_DATA_URL)
            .then(response => response.json())
            .then(data => {
                setupSettings(data.settings);
                renderCategories(data.categories);
                renderVideos(data.videos);
                // Fake Live Count Generator
                document.getElementById('user-count').innerText = Math.floor(Math.random() * (150 - 50) + 50);
            }).catch(error => console.error('Error fetching initial data:', error));
    }

    function setupSettings(settings) {
        document.getElementById('site-name').innerHTML = `<i class="fa-solid fa-play"></i> ${settings.siteName || "STREAMX"}`;
        tgAppUrl = settings.tgAppUrl || ""; 
        adTimesArray = (settings.adInterval || "").toString().split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
        
        if (settings.adsgramId && settings.adsgramId !== adsgramId) {
            adsgramId = settings.adsgramId;
            if (window.Adsgram) { adsgramController = window.Adsgram.init({ blockId: adsgramId }); }
        }

        if (settings.monetagZone && settings.monetagZone !== monetagZone) {
            monetagZone = settings.monetagZone;
            let oldScript = document.getElementById('monetag-script'); if(oldScript) oldScript.remove();
            let script = document.createElement('script'); script.id = 'monetag-script'; script.src = '//libtl.com/sdk.js';
            script.setAttribute('data-zone', monetagZone); script.setAttribute('data-sdk', `show_${monetagZone}`);
            document.head.appendChild(script);
        }

        idleAdInterval = parseInt(settings.idleAdInterval) || 0;
        if(settings.idleAdsgramId && settings.idleAdsgramId !== idleAdsgramId) {
            idleAdsgramId = settings.idleAdsgramId;
            if(window.Adsgram) idleAdsgramController = window.Adsgram.init({ blockId: idleAdsgramId });
        }
        resetIdleTimer();
    }

    function renderCategories(categories) {
        const catContainer = document.getElementById('category-container');
        categories.forEach(c => {
            catContainer.innerHTML += `<button class="cat-btn" onclick="filterCategory('${c.name}', this)">${c.name}</button>`;
        });
    }

    function timeAgo(time) {
        if(!time) return '';
        const seconds = Math.floor((new Date() - time) / 1000);
        let interval = seconds / 31536000; if (interval > 1) return Math.floor(interval) + " বছর আগে";
        interval = seconds / 2592000; if (interval > 1) return Math.floor(interval) + " মাস আগে";
        interval = seconds / 86400; if (interval > 1) return Math.floor(interval) + " দিন আগে";
        interval = seconds / 3600; if (interval > 1) return Math.floor(interval) + " ঘণ্টা আগে";
        interval = seconds / 60; if (interval > 1) return Math.floor(interval) + " মিনিট আগে";
        return "কয়েক সেকেন্ড আগে";
    }

    function renderVideos(videos) {
        const list = document.getElementById('video-list');
        list.innerHTML = '';
        let targetVideoId = new URLSearchParams(window.location.search).get('v') || window.Telegram?.WebApp?.initDataUnsafe?.start_param;
        let scrolledToTarget = false;

        videos.forEach(v => {
            const id = v.id;
            let isYT = v.url.includes('youtu'); let isTG = v.url.includes('t.me/');
            let playerHtml = isYT ? `<iframe id="player-${id}" src="https://www.youtube.com/embed/${v.url.split('v=')[1] || v.url.split('/').pop()}?autoplay=0" allowfullscreen></iframe>` : 
                             isTG ? `<iframe id="player-${id}" src="${v.url}?embed=1" allowfullscreen></iframe>` : 
                             `<video id="player-${id}" controls controlsList="nodownload noplaybackrate" disablePictureInPicture playsinline oncontextmenu="return false;"><source src="${v.url}" type="video/mp4"></video>`;
            
            let fcHtml = '';
            let copyBtnStyle = 'flex: 1; font-weight: bold; font-size: 14px;';
            let copyBtnContent = '<i class="fa-solid fa-link"></i> কপি লিংক';

            if (v.fullCollectionUrl && v.fullCollectionUrl.trim() !== "") {
                let reqAds = parseInt(v.fullCollectionAds) || 0;
                let currentProgress = parseInt(localStorage.getItem('fc_progress_' + id)) || 0;
                let btnText = currentProgress >= reqAds ? '<i class="fa-solid fa-unlock"></i> ফুল কালেকশন ওপেন' : `<i class="fa-solid fa-lock"></i> ফুল কালেকশন (${currentProgress}/${reqAds})`;
                let btnColor = currentProgress >= reqAds ? 'var(--success)' : 'transparent';
                let btnBg = currentProgress >= reqAds ? 'rgba(16, 185, 129, 0.1)' : 'rgba(245, 158, 11, 0.1)';
                let btnBorder = currentProgress >= reqAds ? 'var(--success)' : 'var(--warning)';
                let textColor = currentProgress >= reqAds ? 'var(--success)' : 'var(--warning)';
                
                fcHtml = `<button class="btn-full-collection" id="fc-btn-${id}" style="background:${btnBg}; border-color:${btnBorder}; color:${textColor};" onclick="handleFC('${id}', '${v.fullCollectionUrl}', ${reqAds})">${btnText}</button>`;
                copyBtnStyle = 'width: 48px; flex-shrink: 0;';
                copyBtnContent = '<i class="fa-solid fa-link"></i>';
            }

            list.insertAdjacentHTML('beforeend', `
                <div class="card video-card-item" id="card-${id}" data-id="${id}" data-title="${v.title.toLowerCase()}" data-category="${v.category || 'Others'}">
                    <div class="video-wrapper">
                        <div class="lock-screen" id="lock-${id}" onclick="initUnlock('${id}')"><div class="lock-icon"><i class="fa-solid fa-play"></i></div></div>
                        <div class="video-container" id="container-${id}">${playerHtml}
                            <div class="ad-overlay" id="ad-overlay-${id}" onclick="triggerMidAd('${id}')">
                                <div class="ad-content"><i class="fa-solid fa-play"></i> অ্যাড দেখুন এবং কন্টিনিউ করুন</div>
                                <span class="ad-text-small">ভিডিও শুরু করার জন্য অ্যাড দেখতে হবে</span>
                            </div>
                        </div>
                        <img src="${v.thumb}" id="img-${id}" draggable="false">
                    </div>
                    <div class="info">
                        <h3>${v.title}</h3>
                        <span class="v-time"><i class="fa-regular fa-clock"></i> আপলোড: ${timeAgo(v.timestamp)}</span>
                        
                        <div class="stats-row">
                            <div class="views"><i class="fa-solid fa-eye" style="color:var(--primary);"></i> <span id="views-${id}">${v.views || 0}</span> Views</div>
                            <span class="badge"><i class="fa-solid fa-folder-open"></i> ${v.category || 'Others'}</span>
                        </div>
                        
                        <div class="react-group">
                            <button id="like-btn-${id}" class="react-btn" onclick="handleReact('${id}', 'like')"><i class="fa-regular fa-thumbs-up"></i> <span id="likes-${id}">${v.likes || 0}</span></button>
                            <button id="dislike-btn-${id}" class="react-btn" onclick="handleReact('${id}', 'dislike')"><i class="fa-regular fa-thumbs-down"></i> <span id="dislikes-${id}">${v.dislikes || 0}</span></button>
                            <button class="react-btn comment-btn" onclick="openComments('${id}')"><i class="fa-regular fa-comment-dots"></i> <span id="comments-count-${id}">${v.commentCount || 0}</span></button>
                        </div>
                        
                        <button class="btn-unlock" id="btn-${id}" onclick="initUnlock('${id}')"><i class="fa-solid fa-play"></i> Play Video</button>
                        <div class="action-row">${fcHtml}<button class="copy-btn-small" onclick="copyLink('${id}')" style="${copyBtnStyle}" title="Copy Link">${copyBtnContent}</button></div>
                    </div>
                </div>
            `);

            if(localStorage.getItem('react_' + id)) { 
                document.getElementById('like-btn-' + id).disabled = true; 
                document.getElementById('dislike-btn-' + id).disabled = true; 
            }

            if (targetVideoId == id && !scrolledToTarget) {
                scrolledToTarget = true;
                setTimeout(() => document.getElementById('card-' + id).scrollIntoView({ behavior: 'smooth', block: 'center' }), 500);
            }
        });
    }

    // React Handling
    function handleReact(id, type) {
        if(localStorage.getItem('react_' + id)) return;
        
        const formData = new FormData();
        formData.append('action', 'react');
        formData.append('id', id);
        formData.append('type', type);

        fetch(API_ACTION_URL, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    const countEl = document.getElementById(type + 's-' + id);
                    countEl.innerText = parseInt(countEl.innerText) + 1;
                    localStorage.setItem('react_' + id, type);
                    document.getElementById('like-btn-' + id).disabled = true;
                    document.getElementById('dislike-btn-' + id).disabled = true;
                    // Change icon to solid
                    let icon = document.getElementById(type + '-btn-' + id).querySelector('i');
                    icon.classList.remove('fa-regular');
                    icon.classList.add('fa-solid');
                    icon.style.color = "var(--primary)";
                }
            });
    }

    // Video Initialization & Ads
    function initUnlock(id) {
        document.getElementById('lock-' + id).style.display = 'none';
        document.getElementById('img-' + id).style.display = 'none';
        document.getElementById('btn-' + id).style.display = 'none';
        document.getElementById('container-' + id).style.display = 'block';
        
        stopOtherVideos(id);
        isAnyVideoPlaying = true;
        if(idleTimeout) clearTimeout(idleTimeout);

        const p = document.getElementById('player-' + id);
        if(p && p.tagName === "VIDEO") { p.muted = false; p.play().catch(e=>console.log("Auto-play prevented by browser")); }
        
        // Add View
        if (!localStorage.getItem('viewed_' + id)) {
            const formData = new FormData();
            formData.append('action', 'view');
            formData.append('id', id);
            fetch(API_ACTION_URL, { method: 'POST', body: formData });
            localStorage.setItem('viewed_' + id, 'true');
            const viewsEl = document.getElementById('views-' + id);
            viewsEl.innerText = parseInt(viewsEl.innerText) + 1;
        }
        
        setupVideoEventListeners(id);
    }
    
    function setupVideoEventListeners(id) {
        const vid = document.getElementById('player-' + id);
        if (vid && vid.tagName === 'VIDEO' && !vid.dataset.listenersAttached) {
            vid.shownAds = new Set(); 
            vid.addEventListener('play', () => { stopOtherVideos(id); isAnyVideoPlaying = true; if(idleTimeout) clearTimeout(idleTimeout); });
            vid.addEventListener('pause', () => { isAnyVideoPlaying = false; resetIdleTimer(); });
            vid.addEventListener('ended', () => { isAnyVideoPlaying = false; resetIdleTimer(); });
            vid.addEventListener('timeupdate', () => {
                let ct = Math.floor(vid.currentTime);
                if (adTimesArray.includes(ct) && !vid.shownAds.has(ct)) {
                    vid.pause(); vid.shownAds.add(ct);
                    document.getElementById('ad-overlay-' + id).style.display = 'flex';
                }
            });
            vid.dataset.listenersAttached = 'true';
        }
    }

    function stopOtherVideos(currentId) {
        const videos = document.querySelectorAll('video');
        videos.forEach(v => {
            if(v.id !== 'player-' + currentId) { v.pause(); }
        });
        const iframes = document.querySelectorAll('iframe');
        iframes.forEach(ifr => {
            if(ifr.id !== 'player-' + currentId) {
                let src = ifr.src; ifr.src = src; // Simple trick to pause iframes
            }
        });
    }

    // Ads and FC Logic Functions (Implemented to avoid errors)
    function triggerMidAd(id) {
        document.getElementById('ad-overlay-' + id).style.display = 'none';
        showAdNetwork(() => {
            const vid = document.getElementById('player-' + id);
            if(vid && vid.tagName === 'VIDEO') { vid.play(); }
        });
    }

    function handleFC(id, url, reqAds) {
        let currentProgress = parseInt(localStorage.getItem('fc_progress_' + id)) || 0;
        if (currentProgress >= reqAds) {
            window.open(url, '_blank');
        } else {
            showAdNetwork(() => {
                currentProgress++;
                localStorage.setItem('fc_progress_' + id, currentProgress);
                let btn = document.getElementById('fc-btn-' + id);
                if (currentProgress >= reqAds) {
                    btn.innerHTML = '<i class="fa-solid fa-unlock"></i> ফুল কালেকশন ওপেন';
                    btn.style.background = 'rgba(16, 185, 129, 0.1)';
                    btn.style.borderColor = 'var(--success)';
                    btn.style.color = 'var(--success)';
                    alert("ফুল কালেকশন আনলক হয়েছে!");
                } else {
                    btn.innerHTML = `<i class="fa-solid fa-lock"></i> ফুল কালেকশন (${currentProgress}/${reqAds})`;
                }
            });
        }
    }

    function showAdNetwork(callback) {
        if(adsgramController) {
            adsgramController.show().then(callback).catch(callback);
        } else if (typeof show_monetag === 'function') {
            show_monetag().then(callback).catch(callback);
        } else {
            // Fallback if no ads configured
            setTimeout(callback, 500);
        }
    }

    // Search and Filter logic
    function searchVideo() {
        const input = document.getElementById('searchInput').value.toLowerCase();
        const cards = document.querySelectorAll('.video-card-item');
        cards.forEach(card => {
            const title = card.getAttribute('data-title');
            if(title.includes(input)) {
                card.style.display = 'flex';
            } else {
                card.style.display = 'none';
            }
        });
    }

    function filterCategory(category, btnElement) {
        const buttons = document.querySelectorAll('.cat-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');

        const cards = document.querySelectorAll('.video-card-item');
        cards.forEach(card => {
            const cat = card.getAttribute('data-category');
            if (category === 'All' || cat === category) {
                card.style.display = 'flex';
            } else {
                card.style.display = 'none';
            }
        });
    }

    function copyLink(id) {
        let link = window.location.origin + window.location.pathname + '?v=' + id;
        if(tgAppUrl) {
            link = tgAppUrl + "?startapp=" + id;
        }
        navigator.clipboard.writeText(link).then(() => {
            alert("লিংক কপি করা হয়েছে!");
        });
    }

    // Comments Logic
    function openComments(id) {
        currentVideoForComment = id;
        document.getElementById('commentModal').style.display = 'flex';
        const formData = new FormData();
        formData.append('action', 'get_comments');
        formData.append('id', id);

        fetch(API_ACTION_URL, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(comments => renderComments(comments));
    }

    function closeComments() { document.getElementById('commentModal').style.display = 'none'; currentVideoForComment = null; }

    function renderComments(comments) {
        const listContainer = document.getElementById('comment-list-container');
        listContainer.innerHTML = '';
        if(!comments || comments.length === 0) {
            document.getElementById('modal-comment-count').innerText = "0";
            listContainer.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:30px; font-size:16px;">প্রথম কমেন্টটি আপনি করুন!</p>';
            return;
        }
        document.getElementById('modal-comment-count').innerText = comments.length;
        comments.forEach(c => {
            let adminReplyHtml = c.adminReply ? `<div class="admin-reply"><i class="fa-solid fa-shield-halved"></i> <strong>Admin :</strong> ${c.adminReply}</div>` : '';
            listContainer.innerHTML += `<div class="comment-item"><strong><i class="fa-solid fa-circle-user" style="color:var(--text-muted); font-size:18px;"></i> ${c.userName}</strong><p>${c.text}</p>${adminReplyHtml}</div>`;
        });
    }

    function postComment() {
        if(!currentVideoForComment) return;
        const input = document.getElementById('new-comment-text');
        const text = input.value.trim();
        if(text === "") return;

        const formData = new FormData();
        formData.append('action', 'post_comment');
        formData.append('id', currentVideoForComment);
        formData.append('userName', tgUserName);
        formData.append('text', text);

        fetch(API_ACTION_URL, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    input.value = '';
                    openComments(currentVideoForComment); 
                    const countEl = document.getElementById('comments-count-' + currentVideoForComment);
                    countEl.innerText = parseInt(countEl.innerText) + 1;
                }
            });
    }

    // Idle Timer
    function resetIdleTimer() {
        if(idleTimeout) clearTimeout(idleTimeout);
        if(isAnyVideoPlaying || idleAdInterval <= 0) return;
        idleTimeout = setTimeout(() => {
            if(idleAdsgramController) { document.getElementById('idle-popup').style.display = 'flex'; }
        }, idleAdInterval * 1000);
    }
    ['mousemove', 'mousedown', 'keypress', 'touchmove', 'touchstart', 'scroll'].forEach(evt => document.addEventListener(evt, resetIdleTimer, true));

    function handleIdlePopupContinue() {
        document.getElementById('idle-popup').style.display = 'none';
        if(idleAdsgramController) {
            idleAdsgramController.show().then(() => resetIdleTimer()).catch(() => resetIdleTimer());
        } else {
            resetIdleTimer();
        }
    }
</script>
</body>
</html>
